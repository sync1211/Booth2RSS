[package]
name = "booth2rss"
version = "0.2.3"
edition = "2024"

[lib]
name = "booth2rss"
path = "src/lib.rs"

[[bin]]
name = "booth2rss_cli"
path = "src/cli/main.rs"

[[bin]]
name = "booth2rss_web"
path = "src/web/main.rs"

[dependencies]
log = "0.4.34"
reqwest = { version="0.13.5", features = ["json"] }
rss = "2.1.2"
scraper = "0.27.0"
serde = { version="1.0.229", features = ["derive"] }
serde_json = "1.0.154"
url = "2.5.8"
actix-web = "4.17.0"
moka = { version = "0.12.16", features = [ "future" ] }
simple_logger = "5.2.0"
tokio =  { version="1.53.3", features = ["rt-multi-thread", "macros"] }


[profile.release]
codegen-units = 1
lto = "fat"
